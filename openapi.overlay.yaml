        { $ref: '#/components/parameters/embed' },
      ]
  - target: $.paths['/InvoicePos'].get.parameters
    update:
      [
        { $ref: '#/components/parameters/limit' },
        { $ref: '#/components/parameters/offset' },
        { $ref: '#/components/parameters/embed' },
      ]
  - target: $.paths['/OrderPos'].get.parameters
    update:
      [
        { $ref: '#/components/parameters/limit' },
