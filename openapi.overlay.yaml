        { $ref: '#/components/parameters/embed' },
      ]
  - target: $.paths['/CreditNotePos'].get.parameters
    update:
      [
        { $ref: '#/components/parameters/limit' },
        { $ref: '#/components/parameters/offset' },
        { $ref: '#/components/parameters/embed' },
      ]
  - target: $.paths['/CommunicationWay'].get.parameters
    update:
