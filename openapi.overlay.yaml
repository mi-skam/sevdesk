      ]
  - target: $.paths['/Part'].get.parameters
    update:
      [
        { $ref: '#/components/parameters/limit' },
        { $ref: '#/components/parameters/offset' },
        { $ref: '#/components/parameters/embed' },
      ]
  - target: $.paths['/Tag'].get.parameters
    update:
      [
        { $ref: '#/components/parameters/limit' },
        { $ref: '#/components/parameters/offset' },
      ]
  - target: $.paths['/CheckAccount'].get
    update:
      parameters:
        [
          { $ref: '#/components/parameters/limit' },
          { $ref: '#/components/parameters/offset' },
        ]
  - target: $.paths['/CheckAccount/{checkAccountId}/getBalanceAtDate'].get
    update:
      x-sevdesk-notes:
        - Answers "-0" for an account whose transactions cancel out (verified live).
  - target: $.paths['/TagRelation'].get
    update:
      parameters:
        [
          { $ref: '#/components/parameters/limit' },
          { $ref: '#/components/parameters/offset' },
        ]
  - target: $.paths['/ContactAddress'].get
    update:
      parameters:
        [
          { $ref: '#/components/parameters/limit' },
          { $ref: '#/components/parameters/offset' },
        ]
      x-sevdesk-notes:
        - Cannot filter by contact. Fetch all pages and filter on `contact.id`.

  # ------------------------------------------------------ /AccountingContact

  - target: $.paths['/AccountingContact'].get
    update:
      parameters:
        [
          { $ref: '#/components/parameters/limit' },
          { $ref: '#/components/parameters/offset' },
          { $ref: '#/components/parameters/embed' },
        ]
      x-sevdesk-default-order: contact id ascending; records without a contact first, by id ascending.
  - target: $.paths['/AccountingContact/{accountingContactId}'].get
    update:
      parameters: [{ $ref: '#/components/parameters/embed' }]
  - target: $.components.schemas.Model_AccountingContactResponse.properties
    description: Fields the API returns that the spec omits.
    update:
      contact:
        description: >-
          Missing entirely (not null) when the accounting contact belongs to a
          bare name, such as a voucher supplier entered without a contact.
          `contactName` carries the name then.
      contactName:
        type: string
        nullable: true
        description: Set only when `contact` is missing.
      additionalInformation:
        type: string
        nullable: true
        description: Always null in the records seen so far.

  # ----------------------------------------------------- /ContactCustomField

  - target: $.paths['/ContactCustomField'].get
    update:
      parameters:
        [
          {
            name: 'contact[id]',
            in: query,
            description: 'Only the fields of this contact. An ID that is not a contact is rejected with "No Model_Contact with the id … was found".',
            schema: { type: integer },
          },
          {
            name: 'contact[objectName]',
            in: query,
            description: 'Contact; required together with contact[id].',
            schema: { type: string },
          },
          { $ref: '#/components/parameters/limit' },
          { $ref: '#/components/parameters/offset' },
        ]
  - target: $.paths['/ContactCustomFieldSetting'].get
    update:
      parameters:
        [
          { $ref: '#/components/parameters/limit' },
          { $ref: '#/components/parameters/offset' },
        ]

  # ------------------------------------------------------------- /DocServer

  - target: $.paths['/DocServer/getTemplatesWithThumb'].get.parameters[?(@.name == 'type')].schema.enum[1]
    description: Remove `invoicereminder` (index 1 upstream), which matches nothing.
    remove: true
  - target: $.paths['/DocServer/getTemplatesWithThumb'].get.parameters[?(@.name == 'type')].schema
    description: The filter is case-sensitive; the reminder type is spelled Invoicereminder.
    update:
      enum: [Invoicereminder]
  - target: $.paths['/DocServer/getTemplatesWithThumb'].get.parameters[?(@.name == 'type')]
    update:
      description: Type of the templates. Case-sensitive; `invoicereminder` matches nothing, use `Invoicereminder`.
  - target: $.paths['/DocServer/getTemplatesWithThumb'].get
    update:
      x-sevdesk-notes:
        - The response has no `objects` envelope.
        - '`default` comes back as a boolean or a number.'
        - Templates also carry isCustom, img (Base64 thumbnail), inactive, structure and pdfreactorVersion.
  - target: $.paths['/DocServer/getLetterpapersWithThumb'].get
    update:
      x-sevdesk-notes:
        - The response has no `objects` envelope.
        - Letterpapers also carry isCustom.
  - target: $.paths['/CreditNote/{creditNoteId}/sendByWithRender'].get
    update:
      x-sevdesk-notes:
        - Unverified. Despite the GET, the name and the sibling sendBy endpoint indicate that it marks the credit note as sent.

  # ------------------------------------------------------------ /Voucher

  - target: $.paths['/Voucher'].get
    update:
      x-sevdesk-default-order: voucherDate descending; records with the same date come back in arbitrary order.
      parameters:
        - { $ref: '#/components/parameters/createAfter' }
        - { $ref: '#/components/parameters/createBefore' }
        - { $ref: '#/components/parameters/updateAfter' }
        - { $ref: '#/components/parameters/updateBefore' }
  - target: $.paths['/Voucher'].get.parameters[?(@.name == 'startDate')]
    update:
      description: >-
        Only vouchers whose `voucherDate` is at or after this Unix timestamp in
        seconds (inclusive). A `dd.mm.yyyy` string is accepted but ignored: the
        filter then matches every voucher.
      example: 1767225600
  - target: $.paths['/Voucher'].get.parameters[?(@.name == 'endDate')]
    update:
      description: >-
        Only vouchers whose `voucherDate` is **before** this Unix timestamp in
        seconds. Unlike the other document lists, the bound is exclusive: a
        voucher dated exactly at the timestamp is not returned. A `dd.mm.yyyy`
        string is accepted but matches no voucher at all.
      example: 1767225600
  - target: $.paths['/Voucher'].get.parameters[?(@.name == 'descriptionLike')]
    update:
      description: Only vouchers whose `description` (the voucher number) contains this text.
  - target: $.paths['/Voucher'].get.parameters[?(@.name == 'contact[id]')]
    update:
      description: >-
        Only vouchers whose `supplier` is this contact, or a person belonging to
        this organization (`supplier.parent`). Must be sent with
        `contact[objectName]=Contact`.

  # ------------------------------------------------------------ /Invoice

  - target: $.paths['/Invoice'].get
    update:
      x-sevdesk-default-order: id descending.
      parameters:
        - name: showAll
          in: query
          required: false
          description: >-
            Without it, reminders (`invoiceType` `MA`) and recurring invoices
            (`WKR`) are hidden. With `true`, every invoice type is returned.
          schema: { type: boolean }
        - { $ref: '#/components/parameters/createAfter' }
        - { $ref: '#/components/parameters/createBefore' }
        - { $ref: '#/components/parameters/updateAfter' }
        - { $ref: '#/components/parameters/updateBefore' }
  - target: $.paths['/Invoice/{invoiceId}/cancelInvoice'].post
    update:
      x-sevdesk-cancellation: >-
        Returns the cancellation invoice: `invoiceType` `SR`, status `1000`,
        enshrined, `origin` pointing to the original, `sendDate` empty and
        `sendType` copied from the original. The original is set to status
        `1000`. The cancellation is numbered from the invoice counter
        (`SevSequence` type `RE`) even when that number is already used by a
        draft saved with an explicit `invoiceNumber`, because explicit numbers
        do not advance the counter.
  - target: $.paths['/Invoice/{invoiceId}/sendViaEmail'].post
    update:
      x-sevdesk-cancellation-invoices: >-
        Also mails a cancellation invoice (`SR`). Its `sendType` becomes `VM`,
        but `sendDate` stays empty and status stays `1000`. With `copy` set,
        the returned `Email` is the copy to the sender ("Kopie von …").
  - target: $.paths['/Invoice'].get.parameters[?(@.name == 'startDate')]
    update:
      description: >-
        Only invoices whose `invoiceDate` is at or after this Unix timestamp in
        seconds (inclusive). A `dd.mm.yyyy` string is accepted but ignored: the
        filter then matches every invoice.
      example: 1767225600
  - target: $.paths['/Invoice'].get.parameters[?(@.name == 'invoiceNumber')]
    update:
      description: Matches the whole invoice number, ignoring case (`re-1065` finds `RE-1065`, verified live); a part of it such as `1065` matches nothing.
  - target: $.paths['/Invoice'].get.parameters[?(@.name == 'endDate')]
    update:
      description: >-
        Only invoices whose `invoiceDate` is at or before this Unix timestamp in
        seconds (inclusive). A `dd.mm.yyyy` string is accepted but matches no
        invoice at all.
      example: 1767225600
  - target: $.paths['/Invoice'].get.parameters[?(@.name == 'contact[id]')]
    update:
      description: >-
        Only invoices of this contact, or of a person belonging to this
        organization (`contact.parent`). Must be sent with
        `contact[objectName]=Contact`.
  - target: $.paths
    description: Document the delete endpoint that the spec only lists for orders and credit notes.
    update:
      /Invoice/{invoiceId}:
        delete:
          operationId: deleteInvoice
          summary: Deletes an invoice
          description: Not listed in the official spec. Used by this CLI to delete draft invoices.
          x-sevdesk-undocumented: true
          security: [{ api_key: [] }]
          tags: [Invoice]
          parameters:
            - {
                name: invoiceId,
                in: path,
                required: true,
                schema: { type: integer },
              }
          responses:
            '200': { description: The invoice was deleted. }
            '401': { description: Authentication required }

  # -------------------------------------------------------------- /Order

  - target: $.paths['/Order'].get
    update:
      x-sevdesk-default-order: id descending.
      parameters:
        - { $ref: '#/components/parameters/createAfter' }
        - { $ref: '#/components/parameters/createBefore' }
        - { $ref: '#/components/parameters/updateAfter' }
        - { $ref: '#/components/parameters/updateBefore' }
  - target: $.paths['/Order'].get.parameters[?(@.name == 'startDate')]
    update:
      description: Only orders whose `orderDate` is at or after this Unix timestamp in seconds (inclusive).
      example: 1767225600
  - target: $.paths['/Order'].get.parameters[?(@.name == 'endDate')]
    update:
      description: Only orders whose `orderDate` is at or before this Unix timestamp in seconds (inclusive).
      example: 1767225600
  - target: $.paths['/Order'].get.parameters[?(@.name == 'orderNumber')]
    update:
      description: Matches the whole order number, ignoring case (verified live); a part of it matches nothing.

  # --------------------------------------------------------- /CreditNote

  - target: $.paths['/CreditNote'].get.parameters[?(@.name == 'startDate')]
    update:
      description: >-
        Only credit notes dated at or after this Unix timestamp in seconds. The
        schema is an integer; the original `01.01.2020` example contradicts it
        (unverified on a live account).
      example: 1767225600
  - target: $.paths['/CreditNote'].get.parameters[?(@.name == 'endDate')]
    update:
      description: >-
        Only credit notes dated up to this Unix timestamp in seconds. Whether the
        bound is inclusive is unverified.
      example: 1767225600

  # ------------------------------------------------------------ /Contact

  - target: $.paths['/Contact'].get
    update:
      x-sevdesk-default-order: id descending.
      parameters:
        - name: name
          in: query
          required: false
          description: Only contacts whose `name`, `surename` or `familyname` contains this text.
          schema: { type: string }
        - name: category[id]
          in: query
          required: false
          description: Only contacts of this category. Must be sent with `category[objectName]=Category`.
          schema: { type: integer }
        - name: category[objectName]
          in: query
          required: false
          schema: { type: string, enum: [Category] }
        - { $ref: '#/components/parameters/createAfter' }
        - { $ref: '#/components/parameters/createBefore' }
        - { $ref: '#/components/parameters/updateAfter' }
        - { $ref: '#/components/parameters/updateBefore' }
  - target: $.paths['/Contact'].get.parameters[?(@.name == 'depth')]
    update:
      description: >-
        `0` (the default) returns organizations only, i.e. contacts with a
        `name`. `1` also returns persons.

  # ------------------------------------------ /CheckAccountTransaction

  - target: $.paths['/CheckAccountTransaction'].get
    update:
      x-sevdesk-default-order: valueDate descending; records with the same date come back in arbitrary order.
  - target: $.paths['/CheckAccountTransaction'].get.parameters[?(@.name == 'isBooked')]
    update:
      description: >-
        `true` returns only booked transactions. `false` is ignored and returns
        every transaction; filter on `status == "100"` client-side to get
        unbooked ones.
  - target: $.paths['/CheckAccountTransaction'].get.parameters[?(@.name == 'startDate')]
    update:
      description: >-
        Only transactions whose `valueDate` is at or after this moment
        (inclusive). An ISO 8601 date or date-time.
  - target: $.paths['/CheckAccountTransaction'].get.parameters[?(@.name == 'endDate')]
    update:
      description: >-
        Only transactions whose `valueDate` is at or before this moment
        (inclusive). An ISO 8601 date or date-time.
  - target: $.paths['/CheckAccountTransaction'].get.parameters[?(@.name == 'payeePayerName')]
    update:
      description: Only transactions whose `payeePayerName` contains this text.
  - target: $.paths['/CheckAccountTransaction'].get.parameters[?(@.name == 'paymtPurpose')]
    update:
      description: Only transactions whose `paymtPurpose` contains this text.

  # ------------------------------------------------------- other lists

  - target: $.paths['/CheckAccount'].get
    update:
      x-sevdesk-default-order: The default account first, then id ascending.
  - target: $.paths['/VoucherPos'].get
    update:
      x-sevdesk-default-order: id ascending.
      x-sevdesk-notes:
        - Without `voucher[id]` the positions of all vouchers are returned.
        - '`accountDatev` is `null` for legacy bookkeeping-1.0 positions, which carry `accountingType` instead.'
  - target: $.paths['/InvoicePos'].get
    update:
      x-sevdesk-notes:
        - Without `invoice[id]` the positions of all invoices are returned.
        - Use this endpoint instead of `GET /Invoice/{invoiceId}/getPositions` to page through positions; the latter ignores `offset` on live accounts.
  - target: $.paths['/Part'].get
    update:
      x-sevdesk-default-order: id descending.
  - target: $.paths['/Part'].get.parameters[?(@.name == 'name')]
    update:
      description: Only parts whose `name` contains this text.

  # ------------------------------------------------------ voucher booking

  - target: $.paths['/Voucher/{voucherId}/bookAmount'].put.requestBody.content['application/json'].schema.properties.amount
    update:
      description: >-
        The amount as it flows over the check account: **negative** for expense
        vouchers (`creditDebit` `C`), positive for revenue vouchers. Can be a
        partial amount. A positive amount on an expense voucher is accepted
        without error but stored as a negative `paidAmount`, which leaves the
        voucher at status `750` with `payDate` `null`.

  # ------------------------------------------------------ removed endpoints

  - target: $.paths['/Export/datevCSV']
    description: Removed by sevdesk on 30.05.2025 in favour of the export job endpoints.
    remove: true
  - target: $.paths['/CreditNote/Factory/createFromVoucher']
    description: No longer available in bookkeeping system 2.0.
    remove: true

  # ------------------------------------------------ undocumented endpoints

  - target: $.components.schemas
    update:
      Model_AccountDatev:
        type: object
        description: A booking account (DATEV account). Fields reflect observed responses; every scalar is a string.
        properties:
          id: { type: string }
          objectName: { type: string, example: AccountDatev }
          create:
            type: string
            nullable: true
            description: '`null` for standard accounts in list responses; `GET /AccountDatev/{accountDatevId}` returns a timestamp.'
          update:
            type: string
            nullable: true
            description: Same as `create`.
          number:
            {
              type: string,
              nullable: true,
              description: Account number in the client's chart of accounts (e.g. SKR04).,
            }
          number03:
            {
              type: string,
              nullable: true,
              description: The corresponding SKR03 number.,
            }
          name: { type: string, nullable: true }
          name03: { type: string, nullable: true }
          taxRate: { type: string, nullable: true }
          deprecated: { type: string, nullable: true }
          hidden: { type: string, nullable: true }
          deactivated: { type: string, nullable: true }
          expenseAccount: { type: string, nullable: true }
          revenueAccount: { type: string, nullable: true }
          assetAccount: { type: string, nullable: true }
          balanceSide: { type: string, nullable: true }
          simpleDescription: { type: string, nullable: true }
          translatedNumber: { type: string, nullable: true }
          translatedName: { type: string, nullable: true }
          validFrom: { type: string, nullable: true }
          validUntil: { type: string, nullable: true }
          accountCategory:
            type: object
            nullable: true
            properties: { id: { type: string }, objectName: { type: string } }
          accountDatevCategory:
            type: object
            nullable: true
            properties: { id: { type: string }, objectName: { type: string } }
      Model_DocumentFile:
        type: object
        properties:
          filename: { type: string, nullable: true }
          mimeType: { type: string }
          base64Encoded: { type: boolean }
          content:
            { type: string, description: 'The file content, Base64-encoded.' }
      Model_NumberSequence:
        type: object
        properties:
          id: { type: string }
          forObject: { type: string }
          type: { type: string }
          format: { type: string }
          nextSequence:
            type: string
            description: The configured counter. Not a reservation; existing drafts can already use this number.

  - target: $.paths
    update:
      /AccountDatev:
        get:
