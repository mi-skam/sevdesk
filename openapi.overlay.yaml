# OpenAPI Overlay 1.0 with corrections to the official sevdesk API spec.
#
# Apply it with `npm run openapi:patch`, which downloads nothing: it reads the
# spec from ./openapi.yaml (see the README for the download command) and
# writes ./openapi.patched.yaml. Both files are gitignored; only this overlay
# is versioned.
#
# Every statement below was verified against a live account through this
# repository's CLI unless it says "unverified", or it comes from the sevdesk
# API news (https://tech.sevdesk.com/api_news/). The patched spec is a
# reference for humans. As with the original, never generate code from it.
overlay: 1.0.0
info:
  title: sevdesk API corrections (mi-skam/sevdesk)
  version: 1.0.0
extends: https://api.sevdesk.de/openapi.yaml

actions:
  # ---------------------------------------------------------------- general

  - target: $.info
    description: Mark the result as patched.
    update:
      title: sevdesk API (patched by the mi-skam/sevdesk overlay)
      x-overlay:
        source: https://github.com/mi-skam/sevdesk/blob/main/openapi.overlay.yaml
        notes: See the "Overlay notes" tag for corrections that apply to the whole API.

  - target: $.tags
    description: Add a section with API-wide corrections.
    update:
      - name: Overlay notes
        x-displayName: Overlay notes (corrections)
        description: |
          Corrections and additions from the mi-skam/sevdesk overlay. They apply
          to the whole API. Endpoint-specific corrections are in the descriptions
          of the affected parameters and in `x-sevdesk-*` extensions.

          - **Authentication**: the token is accepted only in the
            `Authorization` header, sent raw without `Bearer`. Passing it as a
            query parameter was removed on 29.04.2025.
          - **Pagination**: list endpoints take `limit` and `offset` even where
            this spec does not declare them. Without `limit` they return 100
            rows, which silently truncates. `limit` must be an integer from 1 to
            1000; anything else is `400` "Invalid 'limit' parameter" (since
            30.05.2025). Page until an empty page rather than a short one.
          - **Envelope**: responses wrap the payload in `{ "objects": … }`.
            Endpoints that return a single object still return an array.
          - **Scalars**: responses return every scalar as a string, including
            IDs, amounts and flags.
          - **Partial updates**: `PUT` with `mapAll: true` is a genuine partial
            update. Fields left out keep their stored value, verified on
            `/ContactAddress/{contactAddressId}`.
          - **Validation errors**: some validation errors on orders, invoices,
            vouchers and credit notes come back as `500` instead of `422`
            (acknowledged by sevdesk). A client that retries `5xx` retries
            these too.
          - **Bookkeeping system 2.0**:
            - `enshrined` and invoice or credit-note `status` cannot be set
              directly. Use `/enshrine`, `bookAmount` and the send endpoints.
            - New vouchers can only be status `50` or `100`.
            - Quotes, orders and delivery notes with a negative total are
              rejected.
          - **Payment links**: no endpoint exposes the link between a voucher and
            the transaction it was booked against. The `object[id]` filter and
            the CSV exports do not either.
          - **Render responses**: since 07.04.2026, `render`, `changeParameter`
            and `sendByWithRender` on Invoice, Order, CreditNote and Letter
            return the whole document as Base64 in `pdf`. The former per-page
            `thumbs` and `pages` are gone.
          - **Removed endpoints** (deleted from this patched spec):
            - `GET /Export/datevCSV` was removed on 30.05.2025. Use
              `createDatevCsvZipExportJob`, the job progress endpoint and the
              download endpoint instead.
            - `POST /CreditNote/Factory/createFromVoucher` no longer exists in
              bookkeeping system 2.0.

  - target: $['x-tagGroups'][0].tags
    update:
      - Overlay notes

  - target: $.components
    description: Shared parameters that the spec only describes in prose.
    update:
      parameters:
        limit:
          name: limit
          in: query
          required: false
          description: >-
            Rows per page, an integer from 1 to 1000. Without it the API returns
            100 rows, which silently truncates the result. Values outside 1–1000
            and non-integers are `400` (since 30.05.2025).
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        offset:
          name: offset
          in: query
          required: false
          description: Number of rows to skip. Applied after the server-side filters.
          schema: { type: integer, minimum: 0, default: 0 }
        embed:
          name: embed
          in: query
          required: false
          description: >-
            Comma-separated list of references to inflate into full objects, for
            example `contact` or `supplier`. Without it references are
            `{ id, objectName }` only.
          schema: { type: string }
        createAfter:
          name: createAfter
          in: query
          required: false
          description: >-
            Only records created at or after this Unix timestamp in seconds. The
            bound is inclusive despite the name. Documented by sevdesk only in the
            tag description.
          schema: { type: integer }
          example: 1767225600
        createBefore:
          name: createBefore
          in: query
          required: false
          description: Only records created at or before this Unix timestamp in seconds (inclusive).
          schema: { type: integer }
          example: 1767225600
        updateAfter:
          name: updateAfter
          in: query
          required: false
          description: >-
            Only records last changed at or after this Unix timestamp in seconds.
            The bound is inclusive: a record whose `update` equals the value is
            returned. Suitable for incremental sync, but it cannot reveal
            deletions.
          schema: { type: integer }
          example: 1767225600
        updateBefore:
          name: updateBefore
          in: query
          required: false
          description: Only records last changed at or before this Unix timestamp in seconds (inclusive).
          schema: { type: integer }
          example: 1767225600

  # ------------------------------------------------- pagination on all lists

  - target: $.paths['/Voucher'].get.parameters
    update:
