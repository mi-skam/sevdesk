            filter except `limit` and `offset`. Results are sorted by `number`
            compared as text (`135`, `1371`, `140`). The documented alternative,
            ReceiptGuidance, only covers the VAT-relevant subset.
          x-sevdesk-undocumented: true
          security: [{ api_key: [] }]
          tags: [Voucher]
          parameters:
            - { $ref: '#/components/parameters/limit' }
            - { $ref: '#/components/parameters/offset' }
          responses:
            '200':
              description: Booking accounts
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      objects:
                        {
                          type: array,
                          items:
                            { $ref: '#/components/schemas/Model_AccountDatev' },
                        }
            '401': { description: Authentication required }
      /AccountDatev/{accountDatevId}:
        get:
