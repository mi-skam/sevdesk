  - target: $.paths['/Order'].get.parameters
    update:
      [
        { $ref: '#/components/parameters/limit' },
        { $ref: '#/components/parameters/offset' },
        { $ref: '#/components/parameters/embed' },
      ]
  - target: $.paths['/CreditNote'].get.parameters
    update:
      [
        { $ref: '#/components/parameters/limit' },
        { $ref: '#/components/parameters/offset' },
        { $ref: '#/components/parameters/embed' },
      ]
  - target: $.paths['/Contact'].get.parameters
    update:
      [
        { $ref: '#/components/parameters/limit' },
